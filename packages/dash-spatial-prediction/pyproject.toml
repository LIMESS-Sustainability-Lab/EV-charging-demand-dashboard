[project]
name = "dash-spatial-prediction"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dash>=3.2.0",
    "dash-mantine-components>=2.1.0",
    "dash-pydantic-form>=0.18.3",
    "geopandas>=1.1.1",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "shapely>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dash_spatial_prediction"]

[tool.hatch.build.targets.wheel.force-include]
"dash_spatial_prediction/dash_react_components/dash_react_components.js" = "dash_spatial_prediction/dash_react_components/dash_react_components.js"
"dash_spatial_prediction/dash_react_components/dash_react_components.css" = "dash_spatial_prediction/dash_react_components/dash_react_components.css"
"dash_spatial_prediction/py.typed" = "dash_spatial_prediction/py.typed"
