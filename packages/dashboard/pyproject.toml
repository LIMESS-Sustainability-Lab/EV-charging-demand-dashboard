[project]
name = "dashboard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "altair>=5.5.0",
    "dash>=3.2.0",
    "dash-mantine-components>=2.1.0",
    "dash-pydantic-form>=0.18.3",
    "dash-spatial-prediction",
    "dash-vega-components>=0.11.0",
    "geopandas>=1.1.1",
    "gunicorn>=23.0.0",
    "joblib>=1.5.2",
    "pandas>=2.3.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "scikit-learn>=1.6.1",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.43",
    "torch>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
